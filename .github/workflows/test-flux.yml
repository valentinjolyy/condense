name: Test des flux
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q feedparser requests
      - run: python scripts/test_flux.py
        env:
          GH_TOKEN: ${{ github.token }}
