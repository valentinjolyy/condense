name: Relais du Condensé

on:
  schedule:
    - cron: "4 * * * *"   # toutes les heures (quota gratuit de Gemini)
  workflow_dispatch:
    inputs:
      ping:
        description: "Forcer une vérification de l'IA"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: condense-relais
  cancel-in-progress: false

jobs:
  relais:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q feedparser requests cryptography
      - name: Relevé des flux et phrases du direct
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONDENSE_PASS: ${{ secrets.CONDENSE_PASS }}
          CONDENSE_REPO: ${{ github.repository }}
          CONDENSE_TOKEN: ${{ github.token }}
          RELAY_PING: ${{ github.event.inputs.ping }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: python scripts/relay.py
      - name: Republier le site
        if: hashFiles('published.flag') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
      # GitHub suspend les tâches planifiées après 60 jours sans activité : on les garde actives.
      - name: Garder la planification active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/relais.yml/enable" || true
